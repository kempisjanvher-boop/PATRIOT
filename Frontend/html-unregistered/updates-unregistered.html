<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Patriot login</title>
        <link rel="stylesheet" href="/Frontend/css-unregistered/updates-unregistered.css">
        <link rel="stylesheet" href="/Frontend/css-unregistered/footer.css">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="site-header"></div>
        <main>
            <section class="updates-hero">
                <div class="updates-hero-overlay">
                    <h1 class="updates-display-title">UPDATES</h1>
                </div>
            </section>
        </main>
        <div id="site-footer"></div>

        <script> 
            fetch("./header-unregistered.html").then(res => res.text()).then(html => {
                document.getElementById("site-header").innerHTML = html;
                });

            fetch("./footer.html")
                .then(res => res.text())
                .then(html => {
                    document.getElementById("site-footer").innerHTML = html;
                });

            function toggleMenu() {
                const menu = document.getElementById('options');
                menu.classList.toggle('show');
            }
        </script>
    </body>
</html>
